name: Release

# Push a tag like `v0.1.0` (matching the version in Cargo.toml), or publish
# a release with that tag on GitHub, to build kru for every platform and
# attach the archives to the release.
# Running it by hand builds the archives without releasing them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check the tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    # Run even when check-version was skipped (manual runs), not when it failed.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="kru-$TARGET"
          mkdir -p dist package
          cp README.md LICENSE-MIT LICENSE-APACHE package/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/kru.exe" package/
            archive="$name.zip"
            (cd package && 7z a "../dist/$archive" kru.exe README.md LICENSE-MIT LICENSE-APACHE > /dev/null)
          else
            cp "target/$TARGET/release/kru" package/
            archive="$name.tar.gz"
            tar czf "dist/$archive" -C package kru README.md LICENSE-MIT LICENSE-APACHE
          fi
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kru-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Works whether the release was drafted on GitHub first (publishing it
      # creates the tag that started this run) or only the tag was pushed.
      - name: Publish the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "kru $GITHUB_REF_NAME" --generate-notes
          fi
