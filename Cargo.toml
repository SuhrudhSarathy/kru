[package]
name = "kru"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Tasks, organised in buckets: a CLI and TUI task manager"
repository = "https://github.com/SuhrudhSarathy/kru"
readme = "README.md"
keywords = ["tasks", "todo", "tui", "cli"]
categories = ["command-line-utilities"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
directories = "6.0.0"
jiff = {version = "0.2.38", features = ["serde"]}
ratatui = "0.30.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v4", "v7", "serde"] }
